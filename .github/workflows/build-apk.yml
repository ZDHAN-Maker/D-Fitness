name: Build Android APK (D-Fitness)

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Live Vercel / Hosted App URL (contoh: https://d-fitness.vercel.app)'
        required: false
        default: 'https://d-fitness.vercel.app'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Capacitor Server URL
        env:
          INPUT_URL: ${{ inputs.server_url }}
          SECRET_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
        run: |
          TARGET_URL="${INPUT_URL:-${SECRET_URL:-https://d-fitness.vercel.app}}"
          echo "Setting Capacitor Server URL to: $TARGET_URL"
          sed -i "s|url: process.env.CAPACITOR_SERVER_URL.*|url: '$TARGET_URL',|g" capacitor.config.ts || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Fitness-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
